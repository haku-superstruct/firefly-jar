<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101736"/>
      <stop offset="1" stop-color="#1d2a52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffee9a" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffe066" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="320" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#cfe0ff">
    <rect x="40" y="36" width="3" height="3"/><rect x="120" y="70" width="3" height="3"/>
    <rect x="210" y="28" width="3" height="3"/><rect x="330" y="58" width="3" height="3"/>
    <rect x="420" y="30" width="3" height="3"/><rect x="270" y="92" width="3" height="3"/>
    <rect x="70" y="110" width="3" height="3"/><rect x="380" y="110" width="3" height="3"/>
  </g>
  <!-- moon -->
  <circle cx="66" cy="52" r="20" fill="#f4ecd2"/>
  <circle cx="76" cy="44" r="17" fill="#101736"/>
  <!-- hills -->
  <ellipse cx="70" cy="330" rx="220" ry="70" fill="#16281c"/>
  <ellipse cx="420" cy="340" rx="240" ry="80" fill="#14261b"/>
  <rect y="272" width="480" height="48" fill="#1e3a26"/>
  <!-- fireflies -->
  <g>
    <circle cx="150" cy="150" r="16" fill="url(#glow)"/><circle cx="150" cy="150" r="3.4" fill="#fff3ae"/>
    <circle cx="215" cy="105" r="13" fill="url(#glow)"/><circle cx="215" cy="105" r="2.8" fill="#fff3ae"/>
    <circle cx="300" cy="170" r="18" fill="url(#glow)"/><circle cx="300" cy="170" r="3.8" fill="#fff3ae"/>
    <circle cx="352" cy="120" r="12" fill="url(#glow)"/><circle cx="352" cy="120" r="2.6" fill="#fff3ae"/>
    <circle cx="110" cy="205" r="12" fill="url(#glow)"/><circle cx="110" cy="205" r="2.6" fill="#fff3ae"/>
  </g>
  <!-- kid -->
  <g transform="translate(238,238)">
    <rect x="-9" y="26" width="7" height="16" fill="#233047"/>
    <rect x="3" y="26" width="7" height="16" fill="#233047"/>
    <rect x="-12" y="2" width="24" height="26" rx="4" fill="#e2543e"/>
    <circle cx="0" cy="-12" r="13" fill="#f2c29b"/>
    <path d="M -13 -14 A 13 13 0 0 1 13 -14 Z" fill="#2e7d4f"/>
    <rect x="4" y="-16" width="16" height="5" fill="#2e7d4f"/>
    <!-- net -->
    <line x1="10" y1="8" x2="34" y2="-12" stroke="#c9a86a" stroke-width="4"/>
    <circle cx="44" cy="-20" r="12" fill="none" stroke="#e6f0ff" stroke-width="2.5"/>
  </g>
  <!-- jar with caught fireflies -->
  <g transform="translate(392,196)">
    <rect x="0" y="8" width="42" height="52" rx="5" fill="rgba(180,210,255,0.16)" stroke="rgba(210,230,255,0.8)" stroke-width="2"/>
    <rect x="3" y="0" width="36" height="8" rx="2" fill="#8a6f4d"/>
    <circle cx="13" cy="44" r="9" fill="url(#glow)"/><circle cx="13" cy="44" r="2.4" fill="#fff3ae"/>
    <circle cx="27" cy="36" r="9" fill="url(#glow)"/><circle cx="27" cy="36" r="2.4" fill="#fff3ae"/>
    <circle cx="20" cy="50" r="9" fill="url(#glow)"/><circle cx="20" cy="50" r="2.4" fill="#fff3ae"/>
  </g>
</svg>
